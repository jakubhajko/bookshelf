[project]
name = "book-app"
version = "0.1.0"
description = "Book discovery application — FastAPI backend."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "structlog>=24.4",
    "alembic>=1.13",
    "pandas>=2.2",
    "pyarrow>=17.0",
    # Offline artifact builders assemble the numeric payloads the recommender
    # package loads at runtime. Already present transitively via
    # book-recommender-engine; declared explicitly because this package
    # imports it directly (see cli/build_source_similarity.py).
    "numpy>=2.0",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    # S3-compatible object storage client. Used to fetch model artifacts at
    # startup when ARTIFACT_STORAGE_BACKEND=s3 (Cloudflare R2 today, real AWS
    # S3 by changing one endpoint URL — see shared/storage/s3_artifacts.py).
    "boto3>=1.35",
    "book-recommender-engine",
]

[tool.uv.sources]
book-recommender-engine = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx2>=2.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
]
# Offline artifact-build dependencies (ADR-0018, ADR-0021). NOT installed by
# `uv sync` or `make setup`, and never imported by anything the API serves:
# the API loads matrices, it never trains or encodes. Install explicitly with
# `make setup-training` (or `uv sync --group training --project apps/api`)
# before running the model builders.
#
# The runtime counterpart of each of these lives in the recommender package
# as plain NumPy: ALS fold-in solves against fixed item factors without
# `implicit`, and neighbour lookup is an array slice without `scipy`.
training = [
    "implicit>=0.7.2",
    "scipy>=1.14",
    # Offline text encoder for the content embeddings (ADR-0018). Pulls the
    # whole torch/transformers stack — which is precisely why it is here and
    # not in the runtime set: the API loads a matrix of vectors, never the
    # model that produced them.
    "sentence-transformers>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/book_app"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is `param: T = Depends(...)` in a
# signature default; that's correct usage, not the mutable-default-argument
# bug B008 otherwise guards against.
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Offline training libraries: ship no type stubs, and are deliberately absent
# from the default environment `make typecheck` runs in (they live in the
# `training` group — ADR-0021). Typechecking must not require installing a
# dependency set the API never uses.
#
# `torch` and `sentence_transformers` were missing from this list until R9.
# The gap was invisible because every run since R5 — the phase that added
# `content_encoding.py` — happened to have the training group installed, so
# the invariant this list exists to protect was quietly untrue for four
# phases. Adding a module to the training group means adding it here too.
[[tool.mypy.overrides]]
module = ["implicit.*", "scipy.*", "torch.*", "sentence_transformers.*"]
ignore_missing_imports = true

# boto3/botocore ship no type stubs (the typed `boto3-stubs` package is a
# separate, very large dependency that would only serve the ~10 lines in
# shared/storage/s3_artifacts.py). That module defines its own `_ObjectGetter`
# Protocol for the slice of the client it actually uses, so the typing that
# matters to callers is checked regardless.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
