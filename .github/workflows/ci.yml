name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql+psycopg://book_app:book_app@127.0.0.1:5433/book_app
  # 127.0.0.1 rather than localhost: localhost can resolve to ::1 first, and
  # the Docker port publish is IPv4 — the same IPv4/IPv6 split that makes two
  # servers look like one.
  PGHOST: 127.0.0.1
  PGPORT: "5433"
  PGUSER: book_app
  PGPASSWORD: book_app
  PGDATABASE: book_app

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    # CI must apply migrations to empty PostgreSQL (spec §13.6) — the
    # integration test step below does exactly that against this service
    # container (tests/integration/conftest.py creates its own database and
    # runs `alembic upgrade head` against it fresh every run).
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: book_app
          POSTGRES_PASSWORD: book_app
          POSTGRES_DB: book_app
        ports:
          # 5433 on the host, not 5432: the runner image ships its own
          # PostgreSQL, and when both listen on 5432 `psql` and psycopg can
          # reach *different* servers — which showed up as `psql` succeeding
          # while the integration tests failed to authenticate as book_app.
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U book_app -d book_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.4"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      # Cheap insurance: if the integration tests ever fail to authenticate
      # again, this says immediately whether they are talking to the service
      # container or to something else the runner is running.
      - name: Show what is listening on Postgres ports
        run: |
          ss -ltnp 2>/dev/null | grep -E '543[0-9]' || echo "(nothing on 543x)"
          psql -tAc "select 'connected to ' || version()" || true

      - name: Enable pg_trgm
        run: psql -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: ruff format --check (apps/api)
        run: cd apps/api && uv run ruff format --check .
      - name: ruff check (apps/api)
        run: cd apps/api && uv run ruff check .
      - name: mypy (apps/api)
        run: cd apps/api && uv run mypy .
      - name: pytest (apps/api)
        run: cd apps/api && uv run pytest --cov=book_app --cov-report=term-missing

      - name: ruff format --check (packages/recommender)
        run: cd packages/recommender && uv run ruff format --check .
      - name: ruff check (packages/recommender)
        run: cd packages/recommender && uv run ruff check .
      - name: mypy (packages/recommender)
        run: cd packages/recommender && uv run mypy .
      - name: pytest (packages/recommender)
        run: cd packages/recommender && uv run pytest

      - name: ruff format --check (tests/integration)
        run: uv run --project apps/api ruff format --check tests
      - name: ruff check (tests/integration)
        run: uv run --project apps/api ruff check tests
      - name: pytest (tests/integration, real PostgreSQL)
        run: cd apps/api && uv run pytest ../../tests/integration -v

      - name: Boot the API and smoke-test health endpoints
        run: |
          cd apps/api
          uv run uvicorn book_app.main:app --host 127.0.0.1 --port 8000 &
          API_PID=$!

          ready=""
          for _ in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/api/v1/health/live > /dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ -z "$ready" ]; then
            echo "API never became reachable" >&2
            kill "$API_PID" || true
            exit 1
          fi

          echo "-- /api/v1/health/live --"
          curl -sf http://127.0.0.1:8000/api/v1/health/live
          echo
          echo "-- /api/v1/health/ready --"
          curl -sf http://127.0.0.1:8000/api/v1/health/ready
          echo

          kill "$API_PID"

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright, real Chromium — spec §13.5)
    runs-on: ubuntu-latest
    # A separate, freshly-migrated Postgres from the `backend` job's — this
    # one stays up for the whole job so the API can run against it directly
    # (the `backend` job's integration tests instead create/drop their own
    # ephemeral per-test databases against its container).
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: book_app
          POSTGRES_PASSWORD: book_app
          POSTGRES_DB: book_app
        ports:
          # 5433 on the host, not 5432: the runner image ships its own
          # PostgreSQL, and when both listen on 5432 `psql` and psycopg can
          # reach *different* servers — which showed up as `psql` succeeding
          # while the integration tests failed to authenticate as book_app.
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U book_app -d book_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.4"
          enable-cache: true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install backend dependencies
        run: uv sync --all-packages

      - name: Install frontend dependencies
        run: cd apps/web && npm ci

      - name: Install Playwright's Chromium (+ OS deps, fresh runner)
        run: cd apps/web && npx playwright install --with-deps chromium

      - name: Enable pg_trgm
        run: psql -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Apply migrations
        run: cd apps/api && uv run alembic upgrade head

      # The real dataset is gitignored (data/README.md) — data/sample/ is
      # the small, checked-in fixture built for exactly this (also used by
      # tests/integration/test_import_catalog.py), not a scaled-down
      # substitute for it.
      - name: Import the sample catalog
        run: cd apps/api && uv run python -m book_app.cli.import_catalog --source ../../data/sample/books.parquet

      - name: Boot the API
        run: |
          cd apps/api
          COVER_STORAGE_LOCAL_PATH=data/sample/covers \
            uv run uvicorn book_app.main:app --host 127.0.0.1 --port 8000 &

          ready=""
          for _ in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/api/v1/health/ready > /dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ -z "$ready" ]; then
            echo "API never became reachable" >&2
            exit 1
          fi

      - name: Run Playwright critical-flow E2E
        run: cd apps/web && npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
